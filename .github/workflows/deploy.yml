name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-northeast3
  GAR_LOCATION: asia-northeast3-docker.pkg.dev
  REPOSITORY: contract-ledger
  BACKEND_IMAGE: backend
  FRONTEND_IMAGE: frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}

      - name: Build and Push Backend
        run: |
          docker build -t ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }} ./backend
          docker push ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Deploy Backend
        id: deploy_backend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: backend
          image: ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: --allow-unauthenticated
          env_vars: |
            NODE_ENV=production
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            GCS_PROJECT_ID=${{ env.PROJECT_ID }}
            GCS_BUCKET_NAME=contract-ledger-files
            SYNC_DB=true
            CORS_ORIGIN=https://contract-ledger.web.app,https://contract-ledger.firebaseapp.com,https://vigilant-shift-490601-t5.web.app,https://vigilant-shift-490601-t5.firebaseapp.com

      - name: Build and Push Frontend
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ steps.deploy_backend.outputs.url }} \
            -t ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            ./frontend
          docker push ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Deploy Frontend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: frontend
          image: ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: --allow-unauthenticated
          env_vars: |
            NODE_ENV=production
            NEXT_PUBLIC_API_URL=${{ steps.deploy_backend.outputs.url }}

      - name: Deploy to Firebase Hosting
        run: |
          npx firebase-tools deploy --only hosting --non-interactive --project ${{ env.PROJECT_ID }}
